# Stage 1 (draft): produce a frozen, standalone Windows build of ghini.desktop
# with the modern py2exe.freeze() API, on a windows-latest GitHub-hosted
# runner. This does NOT yet build the NSIS setup.exe — that's stage 2, once
# we've confirmed the frozen build actually starts on Windows.
#
# Known open question before this can be considered final: the map
# widget (gir1.2-champlain / gir1.2-gtkclutter on Linux) has no
# equivalent project in gvsbuild, so it is not built here. We either
# disable the map feature in the Windows build, or we compile
# libchamplain separately (extra, unplanned work).
#
# Manually triggered on purpose while we iterate; wire up `push`/`tags`
# triggers once this is stable.

name: Windows frozen build (draft, no installer yet)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.13
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: compute Python install dir
        id: py-dir
        shell: pwsh
        run: |
          $pyPath = (Get-Command python).Source
          $pyDir  = Split-Path $pyPath -Parent
          echo "dir=$pyDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Python dir usato: $pyDir"

      # windows-latest already ships Visual Studio 2022 Build Tools, which is
      # what gvsbuild needs - no separate VS install step required.
      # actions/cache (the combined action) only saves on job SUCCESS by
      # default. Since a later step can still fail after gvsbuild's ~35
      # minute build, we split restore/save so the cache is kept even when
      # something downstream breaks - otherwise every failed run throws
      # the GTK3 build away and starts over from zero.
      - name: Restore GTK3 stack (gvsbuild) from cache
        id: gtk-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\gtk-build
          key: gvsbuild-gtk3-py313-v2

      - name: Build GTK3 + PyGObject with gvsbuild
        if: steps.gtk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          pip -m pip instal --upgrade pip
          python -m pip install gvsbuild
          python -m gvsbuild build --enable-gi --py-wheel --python-dir "${{ steps.py-dir.outputs.dir }}" gtk3 pygobject pycairo adwaita-icon-theme gdk-pixbuf librsvg

      - name: Save GTK3 stack to cache
        if: always() && steps.gtk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\gtk-build
          key: gvsbuild-gtk3-py313-v2

      - name: Put GTK3 on PATH and install its Python wheels
        shell: pwsh
        run: |
          echo "C:\gtk-build\gtk\x64\release\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "GI_TYPELIB_PATH=C:\gtk-build\gtk\x64\release\lib\girepository-1.0" | Out-File -FilePath $enf:GITHUB_ENV -Encoding utf8 -Append
          Get-ChildItem C:\gtk-build\build\x64\release\*\dist\*.whl | ForEach-Object {
            python -m pip install --force-reinstall $_.FullName
          }

      - name: Install ghini.desktop and its Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel "setuptools-scm>=8.0"
          python -m pip install -r requirements\base.lock
          python -m pip install --no-build-isolation -e .

      - name: Smoke-test that GTK3/PyGObject actually import
        shell: pwsh
        run: |
          python -c "import sys; print(sys.executable); print(sys.version)"
          python -m pip show pygobject
          python -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk; print('Gtk', Gtk._version)"

      - name: Freeze with py2exe
        shell: pwsh
        run: |
          python -m pip install --upgrade py2exe
          python scripts\build_win_exe.py

      - name: Upload frozen build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: ghini-windows-dist
          path: dist\
