# Stage 1 (draft): produce a frozen, standalone Windows build of ghini.desktop
# with the modern py2exe.freeze() API, on a windows-2022 GitHub-hosted
# runner. This does NOT yet build the NSIS setup.exe - that's stage 2, once
# we've confirmed the frozen build actually starts on Windows.
#
# Known open question before this can be considered final: the map
# widget (gir1.2-champlain / gir1.2-gtkclutter on Linux) has no
# equivalent project in gvsbuild, so it is not built here. We either
# disable the map feature in the Windows build, or we compile
# libchamplain separately (extra, unplanned work).
#
# Manually triggered on purpose while we iterate; wire up `push`/`tags`
# triggers once this is stable.

name: Windows frozen build (draft, no installer yet)

on:
  workflow_dispatch:

jobs:
  build-windows:
    # NOT windows-latest: as of mid-2026 that image ships Visual Studio 2026
    # (v18), which gvsbuild doesn't support yet (it looks for v17 / VS2022
    # by default). Pin to windows-2022 until gvsbuild adds v18 support.
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.13
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      # windows-2022 already ships Visual Studio 2022 Build Tools, which is
      # what gvsbuild needs - no separate VS install step required.
      #
      # No caching: every run builds GTK3+PyGObject from scratch via
      # gvsbuild (~35+ min). Slower, but the whole pipeline is easier to
      # reason about and there's nothing stale to go wrong.

      - name: Pre-fetch fragile-mirror sources (pixman, cairo)
        shell: pwsh
        run: |
          # gvsbuild pulls several projects from cairographics.org, a small
          # server that times out occasionally (we've now hit it for both
          # pixman and cairo). Debian's source packages repackage the exact
          # same upstream tarballs unmodified (verified: identical sha256
          # below), and deb.debian.org is much sturdier infrastructure.
          # gvsbuild skips its own download if the file already exists (by
          # name) in its default archives dir (C:\gtk-build\src) with a
          # matching hash, so pre-placing these here dodges the flaky
          # mirror entirely. Add more rows here if another project turns
          # out to share the same source.
          $sources = @(
            @{
              Name         = "pixman"
              DestFile     = "pixman-0.46.4.tar.gz"
              Url          = "https://deb.debian.org/debian/pool/main/p/pixman/pixman_0.46.4.orig.tar.gz"
              ExpectedHash = "d09c44ebc3bd5bee7021c79f922fe8fb2fb57f7320f55e97ff9914d2346a591c"
            },
            @{
              Name         = "cairo"
              DestFile     = "cairo-1.18.4.tar.xz"
              Url          = "https://deb.debian.org/debian/pool/main/c/cairo/cairo_1.18.4.orig.tar.xz"
              ExpectedHash = "445ed8208a6e4823de1226a74ca319d3600e83f6369f99b14265006599c32ccb"
            },
            @{
              Name         = "hicolor-icon-theme"
              DestFile     = "hicolor-icon-theme-0.18.tar.xz"
              Url          = "https://deb.debian.org/debian/pool/main/h/hicolor-icon-theme/hicolor-icon-theme_0.18.orig.tar.xz"
              ExpectedHash = "db0e50a80aa3bf64bb45cbca5cf9f75efd9348cf2ac690b907435238c3cf81d7"
            }
          )

          $destDir = "C:\gtk-build\src"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null

          foreach ($src in $sources) {
            $destFile = Join-Path $destDir $src.DestFile
            if (Test-Path $destFile) {
              Write-Host "$($src.DestFile) already present, skipping pre-fetch."
              continue
            }
            Write-Host "Fetching $($src.Url)"
            try {
              Invoke-WebRequest -Uri $src.Url -OutFile $destFile -TimeoutSec 60

              $actualHash = (Get-FileHash -Path $destFile -Algorithm SHA256).Hash.ToLower()
              if ($actualHash -ne $src.ExpectedHash) {
                Remove-Item $destFile -Force
                Write-Host "Hash mismatch on $($src.Name): got $actualHash, expected $($src.ExpectedHash). Skipping pre-fetch, gvsbuild will try its own download."
              } else {
                Write-Host "$($src.Name): hash verified OK."
              }
            } catch {
              Write-Host "Pre-fetch of $($src.Name) failed ($_), gvsbuild will try its own download."
            }
          }

      - name: Build GTK3 + PyGObject with gvsbuild
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install gvsbuild

          # Some upstream mirrors (e.g. cairographics.org) are small,
          # unreliable servers that occasionally time out. gvsbuild tracks
          # which projects it already finished, so retrying re-uses that
          # progress instead of starting over from zero.
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "gvsbuild attempt $attempt of $maxAttempts"
            gvsbuild build --configuration release --enable-gi --py-wheel gtk3 pygobject pycairo adwaita-icon-theme gdk-pixbuf librsvg
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq $maxAttempts) {
              throw "gvsbuild failed after $maxAttempts attempts"
            }
            Write-Host "Attempt $attempt failed (exit $LASTEXITCODE), retrying in 30s..."
            Start-Sleep -Seconds 30
          }

      - name: Put GTK3 on PATH and install its Python wheels
        shell: pwsh
        run: |
          echo "C:\gtk-build\gtk\x64\release\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "GI_TYPELIB_PATH=C:\gtk-build\gtk\x64\release\lib\girepository-1.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Fail loudly instead of silently: a bare Get-ChildItem | ForEach-Object
          # does NOTHING if the glob matches zero files - no error, no output,
          # and the missing 'gi' module only surfaces much later at the smoke
          # test, with no clue as to why. Guard against that here.
          $wheels = Get-ChildItem C:\gtk-build\build\x64\release\*\dist\*.whl -ErrorAction Stop
          if (-not $wheels) {
            throw "No .whl files found under C:\gtk-build\build\x64\release\*\dist - gvsbuild output is incomplete."
          }
          $wheels | ForEach-Object {
            Write-Host "Installing $($_.FullName)"
            python -m pip install --force-reinstall $_.FullName
          }

      - name: Install ghini.desktop and its Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel "setuptools-scm>=8.0"
          python -m pip install -r requirements\base.lock
          python -m pip install --no-build-isolation -e .

      - name: Smoke-test that GTK3/PyGObject actually import
        shell: pwsh
        run: |
          python -c "import sys; print(sys.executable); print(sys.version)"
          python -m pip show pygobject
          python -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk; print('Gtk', Gtk._version)"

      - name: Freeze with py2exe
        shell: pwsh
        run: |
          python -m pip install --upgrade py2exe
          python scripts\build_win_exe.py

      - name: Upload frozen build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: ghini-windows-dist
          path: dist\
