name: Docker release image

on:
  push:
    branches: [ "ghini-3.1" ]
    # tags: [ "v3.*" ]
    # Not yet decided whether releases will be triggered by merging into
    # "ghini-3.1" (current model, matches the NSIS/PyPI release trigger) or
    # by pushing an annotated release tag instead. If the tag-based model is
    # chosen, comment out "branches" above and uncomment "tags".

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release version
        id: version
        run: |
          python3 -m pip install --quiet "setuptools-scm>=8.0"
          version="$(python3 -m setuptools_scm)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            GHINI_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
