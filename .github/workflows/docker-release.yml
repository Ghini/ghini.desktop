name: Docker release image

on:
  push:
    # branches: [ "ghini-3.1" ]
    tags: [ "v3.*" ]
    # Tag push means the workflow only ever runs against the exact
    # commit the release tag points to. 

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release version
        id: version
        run: |
          python3 -m pip install --quiet "setuptools-scm>=8.0"
          version="$(python3 -m setuptools_scm)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            GHINI_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.image.outputs.name }}:latest          
