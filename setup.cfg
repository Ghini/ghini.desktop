[flake8]
# normal flake8 stuff
max-line-length = 100
exclude = .venv,.git,build,dist

# flake8-sql options
# Names that contain SQL so the plugin will lint those string literals
# (e.g. functions/vars like execute/text/sql)
sql-excepted-names = execute, executemany, text, sql, SQL

ignore = Q440,Q441,Q442,Q443,Q444,Q445,Q446,Q447,Q448,Q449

